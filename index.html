<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Futbol Ustası Çubuk Adam</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111827;
  touch-action:none;
}

body{
  position:fixed;
  inset:0;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  display:block;
}

#hud{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 8px);
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  z-index:10;
  pointer-events:none;
}

.badge{
  background:rgba(23,32,51,.92);
  color:white;
  padding:8px 10px;
  border-radius:12px;
  font-weight:900;
  font-size:13px;
  white-space:nowrap;
}

#controls{
  position:fixed;
  left:0;
  right:0;
  bottom:calc(env(safe-area-inset-bottom) + 10px);
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  padding:0 12px;
  z-index:20;
}

.moveBtn,.shootBtn{
  width:100%;
  height:68px;
  border:4px solid white;
  border-radius:18px;
  color:white;
  font-size:20px;
  font-weight:900;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  box-shadow:0 5px 12px rgba(0,0,0,.45);
}

#leftButton{
  background:#e94560;
}

#shootButton{
  background:#168a45;
}

#rightButton{
  background:#f2b632;
}

#startScreen,#endScreen{
  position:fixed;
  inset:0;
  width:100%;
  height:100dvh;
  background:rgba(7,17,29,.94);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:30;
  padding:20px;
}

.card{
  width:min(90vw,430px);
  background:white;
  border-radius:24px;
  padding:28px 22px;
  text-align:center;
  color:#172033;
  box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.card h1{
  margin-bottom:14px;
  font-size:28px;
}

.card p{
  line-height:1.5;
  color:#596273;
  margin-bottom:20px;
}

.play{
  border:0;
  border-radius:14px;
  padding:15px 26px;
  background:#168a45;
  color:white;
  font-size:18px;
  font-weight:900;
  touch-action:manipulation;
}

.hidden{
  display:none!important;
}

@media(max-width:380px){

  #controls{
    gap:7px;
    padding-left:7px;
    padding-right:7px;
  }

  .moveBtn,.shootBtn{
    height:62px;
    font-size:18px;
  }

  .badge{
    font-size:11px;
    padding:7px 8px;
  }
}

@media(orientation:landscape){

  #controls{
    bottom:8px;
  }

  .moveBtn,.shootBtn{
    height:58px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div class="badge">
    Atılan Gol:
    <span id="scored">0</span>
  </div>

  <div class="badge">
    Kaçan Gol:
    <span id="missed">0</span>
  </div>

  <div class="badge">
    Süre:
    <span id="time">20</span>
  </div>

</div>


<div id="controls">

  <button id="leftButton" class="moveBtn">
    SOL
  </button>

  <button id="shootButton" class="shootBtn">
    AT
  </button>

  <button id="rightButton" class="moveBtn">
    SAĞ
  </button>

</div>


<div id="startScreen">

  <div class="card">

    <h1>
      Futbol Ustası<br>
      Çubuk Adam
    </h1>

    <p>
      SOL ve SAĞ butonlarına basılı tutarak
      nişan çizgisini yavaşça hareket ettir.
      Hazır olduğunda ortadaki AT butonuna bas!
    </p>

    <button id="start" class="play">
      PENALTIYA BAŞLA
    </button>

  </div>

</div>


<div id="endScreen" class="hidden">

  <div class="card">

    <h1>MAÇ BİTTİ!</h1>

    <p>
      Atılan Gol:
      <b id="finalScored">0</b>
    </p>

    <p>
      Kaçan Gol:
      <b id="finalMissed">0</b>
    </p>

    <button id="restart" class="play">
      TEKRAR OYNA
    </button>

  </div>

</div>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;

let running=false;
let shot=false;

let scored=0;
let missed=0;

let timeLeft=20;

let aim=.5;

let leftHeld=false;
let rightHeld=false;

let ball;
let keeper;
let goal;

let lastTime=0;


/* EKRAN */

function resize(){

  W=window.innerWidth;
  H=window.innerHeight;

  const dpr=Math.min(
    window.devicePixelRatio||1,
    2
  );

  canvas.width=W*dpr;
  canvas.height=H*dpr;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  createField();
}

window.addEventListener(
  "resize",
  resize
);


/* SAHA */

function createField(){

  goal={
    x:W*.13,
    y:H*.16,
    w:W*.74,
    h:Math.min(135,H*.19)
  };

  keeper={
    x:W/2,
    y:goal.y+goal.h*.63
  };

  resetBall();
}


/* KALECİYİ YENİ YERE GÖNDER */

function moveKeeperToNewPlace(){

  /*
    Kaleci her gol sonrasında
    kalenin içinde farklı bir
    konuma geçer.
  */

  const positions=[
    .18,
    .30,
    .42,
    .50,
    .58,
    .70,
    .82
  ];

  let newPosition;

  do{

    newPosition=
      positions[
        Math.floor(
          Math.random()*positions.length
        )
      ];

  }while(
    Math.abs(
      newPosition-
      (keeper.x-goal.x)/goal.w
    )<.12
  );

  keeper.x=
    goal.x+
    goal.w*newPosition;

  keeper.y=
    goal.y+
    goal.h*.63;
}


/* TOP */

function resetBall(){

  ball={
    x:W/2,
    y:H*.76,
    r:11,
    vx:0,
    vy:0,
    active:false
  };

  aim=.5;
  shot=false;
  timeLeft=20;

  leftHeld=false;
  rightHeld=false;

  updateHud();
}


/* BİLGİLER */

function updateHud(){

  document.getElementById(
    "scored"
  ).textContent=scored;

  document.getElementById(
    "missed"
  ).textContent=missed;

  document.getElementById(
    "time"
  ).textContent=
    Math.max(
      0,
      Math.ceil(timeLeft)
    );
}


/* ÇUBUK ADAM */

function stickMan(x,y,s,hasFace=true){

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(s,s);

  ctx.strokeStyle="#172033";
  ctx.lineWidth=7;
  ctx.lineCap="round";

  /* KAFA */

  ctx.fillStyle="#f1c6a4";

  ctx.beginPath();

  ctx.arc(
    0,
    -55,
    18,
    0,
    Math.PI*2
  );

  ctx.fill();
  ctx.stroke();


  /*
    SADECE BİZİM KARAKTERİMİZDE YÜZ VAR
  */

  if(hasFace){

    /* gözler */

    ctx.fillStyle="#172033";

    ctx.beginPath();
    ctx.arc(-6,-59,2.3,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(6,-59,2.3,0,Math.PI*2);
    ctx.fill();


    /* gülümseme */

    ctx.strokeStyle="#172033";
    ctx.lineWidth=2.5;

    ctx.beginPath();

    ctx.arc(
      0,
      -53,
      7,
      .15,
      Math.PI-.15
    );

    ctx.stroke();

  }


  /* GÖVDE */

  ctx.strokeStyle="#172033";
  ctx.lineWidth=7;

  ctx.beginPath();

  ctx.moveTo(0,-37);
  ctx.lineTo(0,2);

  /* KOLLAR */

  ctx.moveTo(0,-25);
  ctx.lineTo(-24,-7);

  ctx.moveTo(0,-25);
  ctx.lineTo(24,-7);

  /* BACAKLAR */

  ctx.moveTo(0,2);
  ctx.lineTo(-20,32);

  ctx.moveTo(0,2);
  ctx.lineTo(20,32);

  ctx.stroke();

  ctx.restore();
}


/* SAHA */

function drawField(){

  ctx.clearRect(
    0,0,W,H
  );

  ctx.fillStyle="#62b64b";

  ctx.fillRect(
    0,0,W,H
  );


  for(let i=0;i<10;i++){

    ctx.fillStyle=
      i%2
      ? "#67bb50"
      : "#60b449";

    ctx.fillRect(
      0,
      i*H/10,
      W,
      H/10
    );
  }


  /* DIŞ ÇİZGİ */

  ctx.strokeStyle="#fff";
  ctx.lineWidth=3;

  ctx.strokeRect(
    10,
    10,
    W-20,
    H-20
  );


  /* ORTA ÇİZGİ */

  ctx.beginPath();

  ctx.moveTo(
    0,
    H*.55
  );

  ctx.lineTo(
    W,
    H*.55
  );

  ctx.stroke();


  /* KALE */

  ctx.strokeRect(
    goal.x,
    goal.y,
    goal.w,
    goal.h
  );


  /* AĞ */

  ctx.strokeStyle="#aaa";
  ctx.lineWidth=1;

  for(
    let x=goal.x;
    x<=goal.x+goal.w;
    x+=18
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      goal.y
    );

    ctx.lineTo(
      x,
      goal.y+goal.h
    );

    ctx.stroke();
  }


  for(
    let y=goal.y;
    y<=goal.y+goal.h;
    y+=18
  ){

    ctx.beginPath();

    ctx.moveTo(
      goal.x,
      y
    );

    ctx.lineTo(
      goal.x+goal.w,
      y
    );

    ctx.stroke();
  }


  /* PENALTI NOKTASI */

  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.arc(
    W/2,
    H*.71,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* ÇİZGİ */

function drawAim(){

  if(shot)return;

  const targetX=
    goal.x+
    goal.w*aim;

  const targetY=
    goal.y+
    goal.h*.32;

  ctx.save();

  ctx.strokeStyle="#ffffffaa";
  ctx.lineWidth=3;

  ctx.setLineDash([
    8,
    8
  ]);

  ctx.beginPath();

  ctx.moveTo(
    ball.x,
    ball.y-8
  );

  ctx.lineTo(
    targetX,
    targetY
  );

  ctx.stroke();

  ctx.restore();
}


/* TOP */

function drawBall(){

  ctx.fillStyle="#0003";

  ctx.beginPath();

  ctx.ellipse(
    ball.x+3,
    ball.y+5,
    ball.r*1.2,
    ball.r*.55,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.r,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#202b3d";

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* ÇİZ */

function draw(){

  drawField();

  drawAim();


  /*
    Kaleci yüzsüz,
    oyuncumuz yüzlü.
  */

  stickMan(
    keeper.x,
    keeper.y+18,
    .72,
    false
  );


  stickMan(
    W/2,
    H*.80,
    1,
    true
  );


  drawBall();
}


/* ŞUT */

function shoot(){

  if(
    !running ||
    shot
  )return;

  shot=true;

  const targetX=
    goal.x+
    goal.w*aim;

  const targetY=
    goal.y+
    goal.h*.32;

  const dx=
    targetX-ball.x;

  const dy=
    targetY-ball.y;

  const len=
    Math.hypot(dx,dy)||1;

  ball.active=true;

  ball.vx=
    dx/len*700;

  ball.vy=
    dy/len*700;
}


/* ŞUT SONU */

function finishShot(isGoal){

  if(isGoal){

    scored++;

    /*
      GOL OLDU!
      Kaleciyi başka yere geçir.
    */

    moveKeeperToNewPlace();

  }else{

    missed++;

  }

  updateHud();


  setTimeout(
    function(){

      if(running){

        resetBall();

      }

    },
    700
  );
}


/* OYUN */

function update(dt){

  if(!running)return;


  /*
    ÇİZGİ KENDİ KENDİNE
    HİÇBİR ZAMAN HAREKET ETMEZ.
  */

  if(!shot){

    if(leftHeld){

      aim-=dt*.38;

      if(aim<0){
        aim=0;
      }

    }


    if(rightHeld){

      aim+=dt*.38;

      if(aim>1){
        aim=1;
      }

    }


    timeLeft-=dt;


    if(timeLeft<=0){

      missed++;

      updateHud();

      shot=true;

      setTimeout(
        function(){

          if(running){
            resetBall();
          }

        },
        700
      );

      return;
    }

    return;
  }


  /* TOP HAREKETİ */

  if(ball.active){

    ball.x+=
      ball.vx*dt;

    ball.y+=
      ball.vy*dt;


    /* KALECİ */

    const speed=250;


    if(keeper.x<ball.x){

      keeper.x+=
        speed*dt;

    }


    if(keeper.x>ball.x){

      keeper.x-=
        speed*dt;

    }


    keeper.x=
      Math.max(
        goal.x+25,
        Math.min(
          goal.x+
          goal.w-
          25,
          keeper.x
        )
      );


    /* KURTARIŞ */

    if(

      ball.y<
      keeper.y+20 &&

      ball.y>
      keeper.y-35 &&

      Math.abs(
        ball.x-
        keeper.x
      )<38

    ){

      ball.active=false;

      finishShot(false);

      return;
    }


    /* KALE */

    if(
      ball.y<
      goal.y+
      goal.h*.62
    ){

      const inside=

        ball.x>
        goal.x+5 &&

        ball.x<
        goal.x+
        goal.w-5;


      ball.active=false;

      finishShot(
        inside
      );
    }

  }
}


/* ANA DÖNGÜ */

function gameLoop(now){

  const dt=
    Math.min(
      .035,
      (now-lastTime)/
      1000 || 0
    );

  lastTime=now;

  update(dt);

  draw();

  requestAnimationFrame(
    gameLoop
  );
}


/* SOL-SAĞ */

function bindMoveButton(
  button,
  direction
){

  function press(e){

    e.preventDefault();
    e.stopPropagation();

    if(
      !running ||
      shot
    )return;


    if(
      direction==="left"
    ){

      leftHeld=true;

    }


    if(
      direction==="right"
    ){

      rightHeld=true;

    }


    try{

      if(
        e.pointerId!==undefined
      ){

        button.setPointerCapture(
          e.pointerId
        );

      }

    }catch(error){}

  }


  function release(e){

    e.preventDefault();
    e.stopPropagation();


    if(
      direction==="left"
    ){

      leftHeld=false;

    }


    if(
      direction==="right"
    ){

      rightHeld=false;

    }

  }


  button.addEventListener(
    "pointerdown",
    press
  );

  button.addEventListener(
    "pointerup",
    release
  );

  button.addEventListener(
    "pointercancel",
    release
  );

  button.addEventListener(
    "lostpointercapture",
    function(){

      if(
        direction==="left"
      ){

        leftHeld=false;

      }


      if(
        direction==="right"
      ){

        rightHeld=false;

      }

    }
  );
}


bindMoveButton(
  document.getElementById(
    "leftButton"
  ),
  "left"
);


bindMoveButton(
  document.getElementById(
    "rightButton"
  ),
  "right"
);


/* AT */

document
.getElementById("shootButton")
.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();
    e.stopPropagation();

    if(
      running &&
      !shot
    ){

      shoot();

    }

  }
);


/* PARMAK BIRAK */

window.addEventListener(
  "pointerup",
  function(){

    leftHeld=false;
    rightHeld=false;

  }
);

window.addEventListener(
  "pointercancel",
  function(){

    leftHeld=false;
    rightHeld=false;

  }
);


/* BAŞLAT */

document
.getElementById("start")
.addEventListener(
  "click",
  function(){

    scored=0;
    missed=0;
    running=true;

    document
    .getElementById("startScreen")
    .classList
    .add("hidden");

    document
    .getElementById("endScreen")
    .classList
    .add("hidden");

    resetBall();

  }
);


/* TEKRAR */

document
.getElementById("restart")
.addEventListener(
  "click",
  function(){

    scored=0;
    missed=0;
    running=true;

    document
    .getElementById("endScreen")
    .classList
    .add("hidden");

    resetBall();

  }
);


/* BAŞLAT */

resize();

requestAnimationFrame(
  gameLoop
);

</script>

</body>
</html>
